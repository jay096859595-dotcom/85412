      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          {
            echo "## 建置失敗，關鍵錯誤如下"
            echo
            if [ -f build.log ]; then
              echo '```'
              grep -nE "^e: |error:|What went wrong|Execution failed for task|Compilation error|Unresolved reference|FAILURE:" build.log | head -60 || true
              echo '```'
              echo
              echo "### 日誌最後 40 行"
              echo '```'
              tail -n 40 build.log || true
              echo '```'
            else
              echo "還沒開始編譯就失敗了（前面的環境步驟出錯），請看上面標紅的那個步驟。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkillCdOverlay-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
